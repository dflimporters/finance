<!--
  AR Collections — monthly collections vs target, by rep. Standalone page next to AR Aging (own Supabase
  client, same Microsoft sign-in and same storage key, so signing in on one signs you in on the other).
  Access is decided in Postgres by ar_my_access() (admins + the ar_access list); reps do not use this portal.

  Data:
    ar_month_targets  frozen at the start of each month by ar_freeze_month() (daily cron, first snapshot of the month)
    ar_month_summary  view: target, credit/write-off adjustments, cash collected in the month, per rep and currency
    ar_aging_rows     only for the "unapplied cash" memo (Payment documents on the latest snapshot)

  Rules:
    - target  = open balance of invoices due by month end (overdue carry-over included), net of open credits,
                frozen at the start of the month
    - actual  = all cash received in the month by payment date, early payments included, voids deducted
    - credit memos and write-offs after the freeze lower the target; they are never counted as collected
    - USD customers stay in USD; the company total converts USD at the month's frozen rate
-->
<style>
:root{
  --navy:#0D1B3E; --navy2:#1a2e5a; --blue:#326BD3; --blue-t:#E8EFFB;
  --bg:#F5F7FA; --card:#FFFFFF; --line:#E1E6EF;
  --ink:#1A2340; --ink2:#4A5578; --ink3:#8A95B0;
  --green:#1A8F4C; --green-t:#E6F4EC; --red:#D63B3B; --red-t:#FBE9E9;
  --hf:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bf:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}

body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--bf)}

.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}

.btn{font:700 12px var(--hf);letter-spacing:.04em;background:var(--blue);color:#fff;border:0;border-radius:6px;height:40px;padding:0 16px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}

.gate{max-width:420px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px;text-align:center}

  .page .panel{overflow:visible}.page .scroll{overflow-x:visible}
  #repTable th{position:sticky;top:calc(var(--hdr) + var(--pin));z-index:20}
}

.psub{color:var(--ink2);margin:0 0 14px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}

.bar input{flex:1;min-width:160px}
.bar.flts{align-items:flex-end}

.flt.grow{flex:1;min-width:200px}.flt.grow input{width:100%}

.colcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.colcard .l{font:600 10px var(--hf);text-transform:uppercase;letter-spacing:.09em;color:var(--ink2)}

tr.rrow{cursor:pointer}tr.rrow:hover td{background:#F7F9FD}tr.rrow.open td{background:#EEF3FC}
.chev{display:inline-block;color:var(--ink3);font-size:11px;width:14px;transition:transform .15s}tr.open .chev{transform:rotate(90deg)}
tr.det>td{padding:0;background:#FBFCFE;text-align:left;white-space:normal}
.det .inner{padding:10px 14px 14px 28px}
.det .inner h4{font:700 11px var(--hf);text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);margin:10px 0 6px}
.det table{font-size:13px;background:#fff;border:1px solid var(--line)}
.det th{background:#F5F7FB;font-size:10px}.det td{padding:6px 9px}
.det tr.crow{cursor:pointer}.det tr.crow:hover td{background:#F7F9FD}.det tr.crow.open td{background:#EEF3FC}
.det tr.tot td{font-weight:700;background:#F5F7FB}
.det tr.docs>td{background:#FBFCFE;padding:4px 10px 12px 30px}
.det .docs table{font-size:12.5px}

@media (max-width:900px){.colsum{grid-template-columns:1fr}}
@media (max-width:640px){
  .page{padding:14px 12px 70px}
  .bar select{width:100%;flex:1 1 100%}
  .flt{flex:1 1 100%}.bar .flt select,.bar .flt input{flex:none;width:100%;min-width:0}

<body>
<header class="hdr">
<div class="topbar"><img src="https://hzagwndglwhcepsirafi.supabase.co/storage/v1/object/public/Assets/DFL%20Logo%20Blue_White.png" alt="DFL Importers"><span id="who"></span><button class="btn ghost small hidden" id="signout">Sign out</button></div>
<nav class="tabs" aria-label="AR sections"><a href="index.html">Aging</a><a class="on" href="collections.html">Collections</a><a href="bad-goods/queue.html">Bad Goods</a><a href="missing-invoices/index.html">Missing Invoices</a></nav>
</header>
<div class="gate hidden" id="gate"></div>
<div class="page hidden" id="app">
  <h1 class="ptitle">AR Collections</h1>
  <p class="psub" id="asof">Loading…</p>

  <div class="pin">
    <div class="bar flts">
      <label class="flt">Month <select id="monthSel" aria-label="Month"></select></label>
      <label class="flt grow">Rep <input id="repSel" list="repList" placeholder="All reps — type or pick" autocomplete="off" aria-label="Sales rep"></label>
      <datalist id="repList"></datalist>
      <label class="flt" title="Included counts unapplied cash on account as collected. It is only known for the latest AR snapshot, so it applies to the current month.">Unapplied cash
        <select id="unapSel" aria-label="Unapplied cash"><option value="memo">Excluded</option><option value="count">Included</option></select></label>
    </div>
    <div class="colsum" id="cards"></div>
  </div>

  <div class="panel">
    <h2>By sales rep</h2>
    <div class="scroll"><table id="repTable"></table></div>
  </div>
  <p class="foot" id="foot"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";
const UNASSIGNED = '__none__';
const $ = id => document.getElementById(id);
// Named sb, never supabase: the CDN script defines supabase as the library. Same storage key as AR Aging so one sign-in covers both pages.
const sb = supabase.createClient('https://hzagwndglwhcepsirafi.supabase.co', 'sb_publishable_5rAinfDT1K9kwEQnqYwlOA_-C5tk_6h', {
  auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'pkce', storageKey:'dfl-ar-aging-auth' }
});
const fmt0 = n => (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('en-US');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthLabel = m => new Date(m + 'T00:00:00').toLocaleDateString('en-GB', { month:'long', year:'numeric' });

async function pageAll(build){
  const out = []; let from = 0;
  for(;;){
    const { data, error } = await build().range(from, from + 999);
    if(error) throw error;
    out.push(...data);
    if(data.length < 1000) break;
    from += 1000;
  }
  return out;
}

let SUMMARY = [], UNAPPLIED = {}, SNAP = null, MONTH = '', REP = '';
let UNAP_COUNT = false;   // true: unapplied cash on account counts toward Collected (latest month only)
const UNAP_BY = new Map();  // "rep|currency" -> Map(customer_id -> { name, amt, rows:[{ ref, date, amt }] }), latest snapshot
const DETAIL = {};          // month -> { by: Map("rep|currency" -> Map(customer_id -> customer breakdown)) } | { loading } | { error }
const OPEN = new Set(), OPEN_CUST = new Set();   // expanded rep rows ("rep|currency") and customers ("rep|currency|customer")
const repKey = r => (r.rep_code || '') + '|' + r.currency;
let SORT = { key:'target', dir:-1 };
const REP_OPTS = [];

async function load(){
  SUMMARY = (await pageAll(() => sb.from('ar_month_summary').select('*').order('month', { ascending:false }).order('rep_code').order('currency')))
    .map(r => Object.assign(r, { target:+r.target, credit_adj:+r.credit_adj, wo_adj:+r.wo_adj, adjusted_target:+r.adjusted_target,
      actual_targeted:+r.actual_targeted, actual_other:+r.actual_other, actual_total:+r.actual_total, rate:+r.rate || 1 }));
  // cash received but not yet applied to an invoice, from the latest AR snapshot, per rep and currency (in that currency,
  // like the rest of the row). Shown as a memo, or counted as collected when the switch says so.
  try {
    const { data: snaps } = await sb.from('ar_aging_snapshots').select('id,snapshot_date').eq('status','complete').order('id',{ascending:false}).limit(1);
    SNAP = snaps && snaps[0] || null;
    UNAPPLIED = {};
    if(SNAP){
      const rows = await pageAll(() => sb.from('ar_aging_rows').select('rep_code,currency,balance_doc,customer_id,customer_name,ref_nbr,doc_date').eq('snapshot_id', SNAP.id).eq('doc_type','Payment').order('ref_nbr'));
      for(const r of rows){
        const amt = -(Number(r.balance_doc) || 0), cur = r.currency || 'JMD';
        const k = (r.rep_code || UNASSIGNED) + '|' + cur; UNAPPLIED[k] = (UNAPPLIED[k] || 0) + amt;
        const rk = (r.rep_code || '') + '|' + cur;
        const m = UNAP_BY.get(rk) || UNAP_BY.set(rk, new Map()).get(rk);
        const c = m.get(r.customer_id) || m.set(r.customer_id, { name:r.customer_name || r.customer_id, amt:0, rows:[] }).get(r.customer_id);
        c.amt += amt; c.rows.push({ ref:r.ref_nbr, date:r.doc_date, amt });
      }
    }
  } catch(e){ console.error(e); UNAPPLIED = {}; }
}

// ---------- per-rep breakdown ----------
// Rebuilds each rep's row customer by customer from the frozen targets and the month's payment lines, with the same rules
// as the ar_month_summary view: cash on a targeted invoice counts as "on targeted" up to the invoice's frozen balance and
// goes to the invoice's rep; the rest (early payments, invoices raised this month, overpayments) is "early / other" and
// goes to the payment's rep. Credit memos and write-offs applied to targeted invoices lower the target.
async function loadDetail(month){
  if(DETAIL[month]) return;
  DETAIL[month] = { loading:true };
  try {
    const end = new Date(month + 'T00:00:00Z'); end.setUTCMonth(end.getUTCMonth() + 1);
    const [tg, pays] = await Promise.all([
      pageAll(() => sb.from('ar_month_targets').select('doc_type,ref_nbr,customer_id,customer_name,rep_code,currency,due_date,balance_doc').eq('month', month).order('id')),
      pageAll(() => sb.from('ar_payments').select('payment_type,payment_ref,payment_date,invoice_ref,applied_amount,currency,customer_id,customer_name,rep_code')
        .eq('is_missing', false).gte('payment_date', month).lt('payment_date', end.toISOString().slice(0, 10))
        .in('payment_type', ['Payment', 'Voided Payment', 'Prepayment', 'Credit Memo', 'Balance WO'])
        .order('adjg_doc_type').order('adjg_ref_nbr').order('line_nbr').order('adjustment_nbr').order('invoice_type').order('invoice_ref'))
    ]);
    DETAIL[month] = { by: buildDetail(tg, pays) };
  } catch(e){ console.error(e); DETAIL[month] = { error:true }; }
  if(month === MONTH) render();
}

function buildDetail(tg, pays){
  const by = new Map();
  const cust = (rk, id, name) => {
    const R = by.get(rk) || by.set(rk, new Map()).get(rk);
    let c = R.get(id);
    if(!c) R.set(id, c = { id, name: name || id, target:0, adj:0, tgt:0, other:0, docs:[], others:[] });
    return c;
  };
  const inv = new Map();   // "ref|currency" -> { bal, c, d }
  for(const t of tg){
    const bal = Number(t.balance_doc) || 0, c = cust((t.rep_code || '') + '|' + t.currency, t.customer_id, t.customer_name);
    const d = { type:t.doc_type, ref:t.ref_nbr, due:t.due_date, bal, paid:0, adj:0 };
    c.target += bal; c.docs.push(d);
    if(t.doc_type === 'Invoice'){ const k = t.ref_nbr + '|' + t.currency, x = inv.get(k); if(x) x.bal += bal; else inv.set(k, { bal, c, d }); }
  }
  const cash = new Map();
  for(const p of pays){
    const amt = Number(p.applied_amount) || 0;
    if(p.payment_type === 'Credit Memo' || p.payment_type === 'Balance WO'){
      const i = inv.get(p.invoice_ref + '|' + p.currency);
      if(i){ i.c.adj += amt; i.d.adj += amt; }
      continue;
    }
    const k = p.invoice_ref + '|' + (p.rep_code || '') + '|' + p.currency;
    const g = cash.get(k) || cash.set(k, { amt:0, ref:p.invoice_ref, rk:(p.rep_code || '') + '|' + p.currency, lines:[] }).get(k);
    g.amt += amt; g.lines.push(p);
  }
  for(const g of cash.values()){
    const i = inv.get(g.ref + '|' + g.lines[0].currency);
    const t = i ? Math.min(g.amt, i.bal) : 0, o = g.amt - t;
    if(i){ i.c.tgt += t; i.d.paid += t; }
    if(Math.abs(o) >= 0.005){
      const c = cust(g.rk, g.lines[0].customer_id, g.lines[0].customer_name);
      c.other += o; c.others.push({ ref:g.ref, amt:o, over:!!i, lines:g.lines });
    }
  }
  return by;
}

const dShort = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short' }) : '';
function detailHtml(r, count, latest, cols){
  const D = DETAIL[MONTH];
  if(!D || D.loading) return '<div class="inner empty">Loading the breakdown…</div>';
  if(D.error) return '<div class="inner empty">Could not load the breakdown. Please refresh, or tell IT Support if it keeps happening.</div>';
  const rk = repKey(r), R = D.by.get(rk) || new Map(), U = latest ? (UNAP_BY.get(rk) || new Map()) : new Map();
  const list = [...new Set([...R.keys(), ...U.keys()])].map(id => {
    const b = R.get(id) || { id, name:U.get(id).name, target:0, adj:0, tgt:0, other:0, docs:[], others:[] }, u = U.get(id);
    const unap = u ? u.amt : 0, col = b.tgt + b.other + (count ? unap : 0);
    return Object.assign({}, b, { unap, unapRows: u ? u.rows : [], col, gap: b.target - b.adj - col });
  }).filter(c => Math.abs(c.target) + Math.abs(c.adj) + Math.abs(c.tgt) + Math.abs(c.other) + Math.abs(c.unap) >= 0.5)
    .sort((a, b) => b.gap - a.gap || a.name.localeCompare(b.name));
  const T = { target:0, adj:0, tgt:0, other:0, unap:0, col:0, gap:0 };
  for(const c of list) for(const k in T) T[k] += c[k];
  const unit = r.currency === 'USD' ? 'US$' : 'J$';
  const num = (v, neg) => '<td class="' + (neg && v ? 'neg' : '') + '">' + (Math.abs(v) >= 0.5 ? fmt0(v) : '') + '</td>';
  const ccols = 8 + (latest ? 1 : 0);
  const row = (c, tot) => num(c.target) + '<td class="hide-m">' + (c.adj ? '-' + fmt0(c.adj) : '') + '</td>' + num(c.target - c.adj) +
    '<td class="hide-m">' + fmt0(c.tgt) + '</td><td class="hide-m">' + (Math.abs(c.other) >= 0.5 ? fmt0(c.other) : '') + '</td>' +
    (latest ? '<td class="hide-m">' + (c.unap ? fmt0(c.unap) : '') + '</td>' : '') +
    '<td><b>' + fmt0(c.col) + '</b></td><td class="hide-m ' + (c.gap <= 0 ? 'neg' : '') + '">' + fmt0(c.gap) + '</td>';
  const head = '<tr><th>Customer</th><th>Target</th><th class="hide-m">Credits / w-o</th><th>Adj. target</th><th class="hide-m">On targeted</th><th class="hide-m">Early / other</th>' +
    (latest ? '<th class="hide-m">Unapplied' + (count ? '' : ' (memo)') + '</th>' : '') + '<th>Collected</th><th class="hide-m">Gap</th></tr>';
  const body = list.map(c => {
    const ck = rk + '|' + c.id, open = OPEN_CUST.has(ck);
    return '<tr class="crow' + (open ? ' open' : '') + '" data-ck="' + esc(ck) + '"><td><span class="chev">▶</span><b>' + esc(c.name) + '</b> <small style="color:var(--ink3)">' + esc(c.id) + '</small></td>' + row(c) + '</tr>' +
      (open ? '<tr class="docs"><td colspan="' + ccols + '">' + custDocs(c, unit) + '</td></tr>' : '');
  }).join('');
  return '<div class="inner"><h4>' + esc(r.rep_code || 'Unassigned') + ' · ' + esc(r.currency) + ' · ' + list.length + ' customer' + (list.length === 1 ? '' : 's') + ' — tap a customer for its documents</h4>' +
    '<div class="scroll"><table>' + head + (body || '<tr><td colspan="' + ccols + '" class="empty">Nothing for this rep this month.</td></tr>') +
    '<tr class="tot"><td>Total</td>' + row(T) + '</tr></table></div>' +
    '<p class="note">Amounts in ' + unit + '. Sorted by largest gap. The total matches the rep\'s row above.</p></div>';
}

function custDocs(c, unit){
  let h = '';
  const docs = c.docs.slice().sort((a, b) => (a.bal < 0) - (b.bal < 0) || String(a.due || '').localeCompare(String(b.due || '')));
  if(docs.length){
    h += '<h4>In the target (open at the start of the month, due by month end)</h4><div class="scroll"><table><tr><th>Document</th><th>Due</th><th>Balance at start</th><th>Collected</th><th class="hide-m">Credits / w-o</th><th>Still open</th></tr>' +
      docs.map(d => { const left = d.bal - d.paid - d.adj;
        return '<tr><td>' + esc(d.type) + ' ' + esc(d.ref) + '</td><td>' + esc(dShort(d.due)) + '</td><td class="' + (d.bal < 0 ? 'neg' : '') + '">' + fmt0(d.bal) + '</td>' +
          '<td>' + (d.paid ? fmt0(d.paid) : '') + '</td><td class="hide-m">' + (d.adj ? '-' + fmt0(d.adj) : '') + '</td><td class="' + (left <= 0.5 && d.bal > 0 ? 'neg' : '') + '">' + (d.bal > 0 ? (left <= 0.5 ? 'paid' : fmt0(left)) : '') + '</td></tr>'; }).join('') +
      '</table></div>';
  }
  if(c.others.length){
    h += '<h4>Early / other cash (not on a targeted invoice)</h4><div class="scroll"><table><tr><th>Applied to</th><th>Payment</th><th>Date</th><th>Counted</th></tr>' +
      c.others.map(o => '<tr><td>' + esc(o.ref) + (o.over ? ' <small style="color:var(--ink3)">(above its start balance)</small>' : '') + '</td>' +
        '<td>' + esc([...new Set(o.lines.map(l => (l.payment_type === 'Payment' ? '' : l.payment_type + ' ') + l.payment_ref))].join(', ')) + '</td>' +
        '<td>' + esc([...new Set(o.lines.map(l => dShort(l.payment_date)))].join(', ')) + '</td><td>' + fmt0(o.amt) + '</td></tr>').join('') + '</table></div>';
  }
  if(c.unapRows.length){
    h += '<h4>Unapplied cash on account (latest AR snapshot)</h4><div class="scroll"><table><tr><th>Payment</th><th>Date</th><th>Unapplied</th></tr>' +
      c.unapRows.map(u => '<tr><td>' + esc(u.ref) + '</td><td>' + esc(dShort(u.date)) + '</td><td>' + fmt0(u.amt) + '</td></tr>').join('') + '</table></div>';
  }
  return h || '<div class="empty">No documents.</div>';
}

const pctOf = (a, t) => t > 0 ? a / t * 100 : null;
const pctHtml = (a, t) => { const p = pctOf(a, t); return p == null ? '—' : '<span class="pct ' + (p >= 100 ? 'ok' : p < 50 ? 'low' : '') + '">' + p.toFixed(1) + '%</span>'; };

function render(){
  const months = [...new Set(SUMMARY.map(r => r.month))];
  if(!months.length){ $('cards').innerHTML = ''; $('repTable').innerHTML = '<tr><td class="empty">No targets have been frozen yet.</td></tr>'; return; }
  if(!MONTH || !months.includes(MONTH)) MONTH = months[0];
  $('monthSel').innerHTML = months.map(m => '<option value="' + m + '"' + (m === MONTH ? ' selected' : '') + '>' + esc(monthLabel(m)) + '</option>').join('');
  const rows = SUMMARY.filter(r => r.month === MONTH && (!REP || (REP === UNASSIGNED ? !r.rep_code : r.rep_code === REP)));
  const latest = MONTH === months[0];
  $('unapSel').disabled = !latest;
  const count = UNAP_COUNT && latest;
  const ua = r => latest ? (UNAPPLIED[(r.rep_code || UNASSIGNED) + '|' + r.currency] || 0) : 0;
  const act = r => r.actual_total + (count ? ua(r) : 0);   // Collected, with unapplied cash when it is counted

  const sum = cur => {
    const rs = rows.filter(r => !cur || r.currency === cur), f = x => rs.reduce((s, r) => s + x(r) * (cur ? 1 : r.rate), 0);
    return { t:f(r => r.adjusted_target), a:f(act), n:rs.length };
  };
  const card = (label, s, unit) => '<div class="colcard"><div class="l">' + label + '</div><div class="v">' + unit + fmt0(s.a) + ' <small>of ' + unit + fmt0(s.t) + '</small></div>' +
    '<div class="pbar"><i class="' + (s.t > 0 && s.a >= s.t ? 'ok' : '') + '" style="width:' + Math.min(100, s.t > 0 ? s.a / s.t * 100 : 0).toFixed(1) + '%"></i></div>' +
    '<div class="s">' + pctHtml(s.a, s.t) + ' collected · ' + (s.a >= s.t ? 'ahead by ' : 'gap ') + unit + fmt0(Math.abs(s.t - s.a)) + '</div></div>';
  const jmd = sum('JMD'), usd = sum('USD'), all = sum(null);
  $('cards').innerHTML = card('JMD customers', jmd, 'J$') + card('USD customers', usd, 'US$') + card('Company total (JMD equivalent)', all, 'J$');

  const acc = { rep: r => (r.rep_code || '~').toLowerCase(), target: r => r.target * r.rate, adj: r => r.adjusted_target * r.rate, actual: r => act(r) * r.rate,
    pct: r => r.adjusted_target > 0 ? act(r) / r.adjusted_target : -1, gap: r => (r.adjusted_target - act(r)) * r.rate, unap: r => ua(r) * r.rate };
  const list = rows.filter(r => r.target || r.actual_total || ua(r)).sort((a, b) => {
    const f = acc[SORT.key] || acc.target, x = f(a), y = f(b), c = typeof x === 'string' ? x.localeCompare(y) : x - y;
    return c ? c * SORT.dir : String(a.rep_code).localeCompare(String(b.rep_code));
  });
  const th = (key, label, cls) => '<th class="sortable ' + (cls || '') + '" data-sort="' + key + '">' + label + (SORT.key === key ? (SORT.dir < 0 ? ' ▼' : ' ▲') : '') + '</th>';
  $('repTable').innerHTML = '<tr>' + th('rep', 'Rep') + '<th>Cur</th>' + th('target', 'Target') + '<th class="hide-m">Credits / write-offs</th>' + th('adj', 'Adj. target') +
    '<th class="hide-m">On targeted invoices</th><th class="hide-m">Early / other</th>' +
    (latest ? th('unap', count ? 'Unapplied' : 'Unapplied (memo)', 'hide-m') : '') +
    th('actual', count ? 'Collected incl. unapplied' : 'Collected', 'ctr') + th('pct', '%') + th('gap', 'Gap', 'hide-m') + '</tr>' +
    (list.map(r => {
      const u = ua(r), a = act(r), rk = repKey(r), open = OPEN.has(rk), cols = latest ? 11 : 10;
      if(open) loadDetail(MONTH);
      return '<tr class="rrow' + (open ? ' open' : '') + '" data-rk="' + esc(rk) + '"><td><span class="chev">▶</span><b>' + esc(r.rep_code || 'Unassigned') + '</b> <small style="color:var(--ink3)">' + esc(r.rep_name && r.rep_name !== r.rep_code ? r.rep_name : '') + '</small></td><td>' + esc(r.currency) + '</td>' +
        '<td>' + fmt0(r.target) + '</td><td class="hide-m">' + (r.credit_adj + r.wo_adj ? '-' + fmt0(r.credit_adj + r.wo_adj) : '') + '</td><td><b>' + fmt0(r.adjusted_target) + '</b></td>' +
        '<td class="hide-m">' + fmt0(r.actual_targeted) + '</td><td class="hide-m">' + fmt0(r.actual_other) + '</td>' +
        (latest ? '<td class="hide-m">' + (u ? fmt0(u) : '') + '</td>' : '') +
        '<td class="ctr"><b>' + fmt0(a) + '</b></td><td>' + pctHtml(a, r.adjusted_target) + '</td>' +
        '<td class="hide-m ' + (r.adjusted_target - a <= 0 ? 'neg' : '') + '">' + fmt0(r.adjusted_target - a) + '</td></tr>' +
        (open ? '<tr class="det"><td colspan="' + cols + '">' + detailHtml(r, count, latest, cols) + '</td></tr>' : '');
    }).join('') || '<tr><td colspan="11" class="empty">No targets for this selection.</td></tr>');

  const rec = rows.some(r => r.reconstructed);
  $('foot').textContent = 'Target = open balance of invoices due by month end (overdue carry-over included) net of open credits, frozen at the start of the month. Collected = all cash received in the month, early payments included, voids deducted. ' +
    'Credit memos and write-offs after the freeze lower the target. USD customers are in USD; the company total converts at the month\'s frozen rate.' +
    (rec ? ' Some invoices paid early in the month were rebuilt from payment history (due date estimated from customer terms).' : '') +
    (count ? ' Unapplied cash on account (payments received but not yet applied to an invoice, as of the latest AR snapshot) is counted as collected, so the gap is what is still to come in from the reps.'
      : ' Unapplied cash on account is a memo, not part of the collected figure' + (latest ? '; set Unapplied cash to Included to see what is still to come in from the reps.' : ', and is only known for the current month.'));
  pinVars();
}

function setupRepSelect(){
  const seen = new Map();
  for(const r of SUMMARY){ const k = r.rep_code || UNASSIGNED; if(!seen.get(k)) seen.set(k, r.rep_name || ''); }
  const keys = [...seen.keys()].sort((a, b) => (a === UNASSIGNED) - (b === UNASSIGNED) || a.localeCompare(b));
  REP_OPTS.length = 0;
  for(const k of keys) REP_OPTS.push({ key:k, label: k === UNASSIGNED ? 'Unassigned (no rep)' : k + (seen.get(k) ? ' — ' + seen.get(k) : '') });
  $('repList').innerHTML = REP_OPTS.map(o => '<option value="' + esc(o.label) + '"></option>').join('');
  const labelFor = key => { const o = REP_OPTS.find(x => x.key === key); return o ? o.label : ''; };
  const sel = $('repSel');
  sel.addEventListener('focus', () => sel.select());
  sel.addEventListener('change', () => {
    const v = sel.value.trim().toLowerCase();
    let key = '';
    if(v){
      const exact = REP_OPTS.find(o => o.label.toLowerCase() === v || o.key.toLowerCase() === v);
      const part = REP_OPTS.filter(o => o.label.toLowerCase().includes(v));
      const hit = exact || (part.length === 1 ? part[0] : null);
      if(!hit){ sel.value = labelFor(REP); return; }
      key = hit.key;
    }
    REP = key; sel.value = labelFor(key); render();
  });
}

// Measures the pinned header and pickers so the table headings can stick right under them.
function pinVars(){
  const h = document.querySelector('.hdr'), p = document.querySelector('.pin');
  const root = document.documentElement.style;
  root.setProperty('--hdr', (h ? h.offsetHeight : 0) + 'px');
  root.setProperty('--pin', (p && getComputedStyle(p).position === 'sticky' ? p.offsetHeight : 0) + 'px');
}
if(window.ResizeObserver){ const ro = new ResizeObserver(pinVars); ['.hdr', '.pin'].forEach(s => { const e = document.querySelector(s); if(e) ro.observe(e); }); }
window.addEventListener('resize', pinVars);

async function init(){
  pinVars();
  try { await load(); }
  catch(e){ console.error(e); $('asof').textContent = ''; $('repTable').innerHTML = '<tr><td class="empty">Could not load collections data. Please refresh, or tell IT Support if it keeps happening.</td></tr>'; return; }
  $('asof').textContent = SNAP ? 'Payments to date · unapplied cash as of the ' + SNAP.snapshot_date + ' AR snapshot' : 'Payments to date';
  setupRepSelect(); render();
}

$('monthSel').addEventListener('change', () => { MONTH = $('monthSel').value; render(); });
$('unapSel').addEventListener('change', () => { UNAP_COUNT = $('unapSel').value === 'count'; render(); });
$('repTable').addEventListener('click', e => {
  const ct = e.target.closest('tr[data-ck]');
  if(ct){ const k = ct.dataset.ck; OPEN_CUST.has(k) ? OPEN_CUST.delete(k) : OPEN_CUST.add(k); render(); return; }
  if(e.target.closest('tr.det')) return;
  const rt = e.target.closest('tr[data-rk]');
  if(rt){ const k = rt.dataset.rk; OPEN.has(k) ? OPEN.delete(k) : OPEN.add(k); render(); return; }
  const h = e.target.closest('th[data-sort]'); if(!h) return;
  const k = h.dataset.sort; SORT.dir = SORT.key === k ? -SORT.dir : (k === 'rep' ? 1 : -1); SORT.key = k; render();
});

const MS_LOGO = '<svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true"><path fill="#f25022" d="M1 1h9v9H1z"/><path fill="#7fba00" d="M11 1h9v9h-9z"/><path fill="#00a4ef" d="M1 11h9v9H1z"/><path fill="#ffb900" d="M11 11h9v9h-9z"/></svg>';
function gate(html){ $('app').classList.add('hidden'); $('gate').classList.remove('hidden'); $('gate').innerHTML = html; }
async function signIn(){
  const { error } = await sb.auth.signInWithOAuth({ provider:'azure', options:{ scopes:'email openid profile', redirectTo: location.origin + location.pathname } });
  if(error) alert("Couldn't start sign-in: " + error.message);
}
async function signOut(){ await sb.auth.signOut(); location.reload(); }
$('signout').addEventListener('click', signOut);

async function start(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    gate('<h2>AR Collections</h2><p>Sign in with your DFL Microsoft account.</p><button class="btn ms" id="signin">' + MS_LOGO + 'Sign in with Microsoft</button>');
    $('signin').addEventListener('click', signIn); return;
  }
  $('signout').classList.remove('hidden'); $('who').textContent = session.user.email || '';
  const { data: access, error } = await sb.rpc('ar_my_access');
  if(!error && access && access.level === 'invoice_clerk'){ location.replace('missing-invoices/index.html'); return; }
  if(error || !access || !access.level){
    gate('<h2>No access</h2><p>You are signed in as <b>' + esc(session.user.email) + '</b>, but this account is not set up for AR. Ask IT Support to add you.</p><button class="btn" id="so">Sign out</button>');
    $('so').addEventListener('click', signOut); return;
  }
  $('who').textContent = (access.name || session.user.email) + ' · ' + access.level.replace('_', ' ');
  $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
  init();
}
start();
})();
</script>
